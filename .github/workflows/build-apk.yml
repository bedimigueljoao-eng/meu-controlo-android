name: Criar APK Android

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Organizar estrutura Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/bedimigueljoao/meucontrolo
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/com/bedimigueljoao/meucontrolo/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app_icon.xml app/src/main/res/drawable/app_icon.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp proguard-rules.pro app/proguard-rules.pro

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bedimigueljoao.meucontrolo'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bedimigueljoao.meucontrolo'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'

                  buildConfigField 'String', 'APP_URL',
                      '"https://bedimigueljoao-eng.github.io/meu-controlo-financeiro/"'
              }

              buildFeatures {
                  buildConfig true
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile(
                          'proguard-android-optimize.txt'
                      ), 'proguard-rules.pro'
                  }
              }
          }
          GRADLE

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Controlo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
