plugins { id 'com.android.application' }

android {
    namespace 'com.bedimigueljoao.meucontrolo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bedimigueljoao.meucontrolo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_URL', '"https://bedimigueljoao-eng.github.io/meu-controlo-financeiro/"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
